# Azure Pipeline for Data Pipeline Tool
# Automatically builds, installs dependencies, and runs a smoke test on every commit.

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
    addToPath: true
  displayName: 'Setup Python 3.11'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    pip install flake8
    # Run flake8 to check for syntax errors and undefined names
    flake8 src/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics
  displayName: 'Lint with flake8'

- script: |
    # Run the main script to verify it executes without crashing
    python main.py
  displayName: 'Run Pipeline Smoke Test'
